<!doctype html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Analyst — Reel Studio V3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#c8ff38;--line:#232a37;--muted:#9aa6b9}
*{box-sizing:border-box}body{margin:0;background:#06080e;color:#fff;font-family:'DM Sans',sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#0b0f18e8;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:12px;background:var(--lime);color:#0e1405;display:grid;place-items:center;font:800 21px 'Space Grotesk'}
.brand h1{margin:0;font:700 15px 'Space Grotesk'} .brand p{margin:2px 0 0;color:var(--muted);font-size:11px}
.btns{display:flex;gap:8px}button{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#1a2130;color:#fff;font:800 12px 'DM Sans';cursor:pointer}button.primary{background:var(--lime);color:#0d120c;border-color:rgba(200,255,56,.5)}
.layout{max-width:1480px;margin:0 auto;padding:18px;display:grid;grid-template-columns:420px 1fr;gap:18px}
.panel{background:#0f141f;border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{margin:0 0 12px;font:700 12px 'Space Grotesk';letter-spacing:.1em;color:var(--lime)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .full{grid-column:1/-1}
label{font-size:10px;color:#aab5c7;font-weight:700;display:block;margin-bottom:6px}
input{background:#080c14;border:1px solid #2a3445;border-radius:8px;padding:10px 11px;color:#fff;font:700 12px 'DM Sans';width:100%}
.canvas-col{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:78px}
.shell{width:min(100%,390px);aspect-ratio:9/16;background:#0a0c12;border:1px solid #2f3849;border-radius:18px;padding:7px;box-shadow:0 30px 80px #000a}
.shell canvas{width:100%;height:100%;display:block;border-radius:12px;background:#000}
.timeline{width:min(100%,390px);background:#101725;border:1px solid var(--line);border-radius:12px;padding:12px}
input[type=range]{width:100%;accent-color:var(--lime)}
.status{font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:900px){.layout{grid-template-columns:1fr} .canvas-col{position:static;order:-1}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="mark">FA</div><div><h1>FOOTBALL ANALYST <span style="color:var(--lime)">/ REEL STUDIO</span> V3 • Top Watermark</h1><p>9:16 studio bg • texts over head with SFX • instant export</p></div></div>
<div class="btns"><button id="previewBtn">▶ Preview</button><button id="exportBtn" class="primary">● Render & Download</button></div>
</header>
<main class="layout">
<section>
<div class="panel">
<h2>01 / Studio Image (9:16)</h2>
<div class="grid"><div class="full"><label>Upload 9:16 studio image</label><input type="file" id="bgImage" accept="image/*"></div></div>
</div>
<div class="panel" style="margin-top:14px">
<h2>02 / Match</h2>
<div class="grid">
<div class="full"><label>League</label><input id="league" value="UEFA CHAMPIONS LEAGUE"></div>
<div class="field"><label>Date</label><input id="schedule" value="TODAY"></div>
<div class="field"><label>Kick-off</label><input id="kickoff" value="10:15 PM"></div>
<div class="field"><label>Home</label><input id="home" value="REAL MADRID"></div>
<div class="field"><label>Away</label><input id="away" value="MAN CITY"></div>
</div>
</div>
<div class="panel" style="margin-top:14px">
<h2>03 / Picks + Watermark</h2>
<div class="grid">
<div class="field"><label>Over/Under</label><input id="market" value="OVER 2.5 GOALS"></div>
<div class="field"><label>Market label</label><input id="marketNote" value="TOTAL GOALS"></div>
<div class="field"><label>Correct Score</label><input id="score" value="2 - 1"></div>
<div class="field"><label>Winner</label><input id="winner" value="REAL MADRID"></div>
<div class="full"><label>Footer</label><input id="footer" value="ANALYST PICK • STAY DISCIPLINED"></div>
<div class="full"><label>Watermark - top middle</label><input id="watermark" value="FOOTBALL ANALYST • 2022"></div>
<div class="field"><label>Duration sec</label><input id="duration" type="number" min="6" max="20" value="9"></div>
</div>
</div>
</section>
<div class="canvas-col">
<div class="shell"><canvas id="c" width="1080" height="1920"></canvas></div>
<div class="timeline">
<div style="display:flex;justify-content:space-between;font:700 11px 'Space Grotesk';color:var(--muted)"><span id="stageLabel">READY</span><span id="timeLabel">00:00 / 9.0s</span></div>
<input id="scrubber" type="range" min="0" max="9" step="0.01" value="0">
<div style="display:flex;gap:6px;margin-top:8px"><button data-time="0" style="font-size:10px">Intro</button><button data-time="1.8" style="font-size:10px">Over</button><button data-time="3.8" style="font-size:10px">Score</button><button data-time="5.8" style="font-size:10px">Winner</button><button data-time="7.2" style="font-size:10px">Final</button></div>
<div id="status" class="status">Upload your image. Texts will animate above head with SFX.</div>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const canvas=$('c'); const ctx=canvas.getContext('2d');
const W=1080, H=1920;
let bg=null, playing=false, raf=0, last=0, t=0, audioCtx=null, lastPhase=-1;
function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function sfxPop(){ try{ const a=getAudio(); const o=a.createOscillator(); const g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(120,a.currentTime); o.frequency.exponentialRampToValueAtTime(270,a.currentTime+0.12); g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.15,a.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.16); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.18);}catch(_){} }
function sfxWhoosh(){ try{ const a=getAudio(); const b=a.createBuffer(1,a.sampleRate*0.22,a.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<ch.length;i++){ const p=i/ch.length; ch[i]=(Math.random()*2-1)*Math.pow(1-p,1.2); } const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=a.createGain(); g.gain.setValueAtTime(0.18,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.22); s.connect(f); f.connect(g); g.connect(a.destination); s.start(); s.stop(a.currentTime+0.22);}catch(_){} }
function sfxTick(){ try{ const a=getAudio(); const o=a.createOscillator(); const g=a.createGain(); o.type='square'; o.frequency.value=1100; g.gain.setValueAtTime(0.18,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.14); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.15);}catch(_){} }
function sfxDeep(){ try{ const a=getAudio(); const o=a.createOscillator(); const g=a.createGain(); o.frequency.setValueAtTime(60,a.currentTime); o.frequency.linearRampToValueAtTime(35,a.currentTime+0.18); g.gain.setValueAtTime(0.14,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.25); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.28);}catch(_){} }
function val(id){ return $(id).value.trim(); }
function roundRect(x,y,w,h,r,fill,stroke){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); } }
function cover(img){ const ir=img.width/img.height, cr=W/H; let dw,dh,dx,dy; if(ir>cr){ dh=H; dw=dh*ir; dx=(W-dw)/2; dy=0; } else { dw=W; dh=dw/ir; dx=0; dy=(H-dh)/2; } ctx.drawImage(img,dx,dy,dw,dh); }
function drawStudio(){
 ctx.clearRect(0,0,W,H);
 if(bg){ cover(bg); } else { const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a1740'); g.addColorStop(1,'#0a0a14'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.fillStyle='#ffffff22'; ctx.font='700 20px "Space Grotesk"'; ctx.textAlign='center'; ctx.fillText('STUDIO BACKDROP',W/2,H/2); }
 const vg=ctx.createLinearGradient(0,0,0,900); vg.addColorStop(0,'rgba(0,0,0,0.45)'); vg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,950);
 const vg2=ctx.createLinearGradient(0,H-450,0,H); vg2.addColorStop(0,'rgba(0,0,0,0)'); vg2.addColorStop(1,'rgba(0,0,0,0.6)'); ctx.fillStyle=vg2; ctx.fillRect(0,H-450,W,450);
}
function easeOutBack(x){ const c1=1.70158; const c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }
function easeOutExpo(x){ return x===1?1:1-Math.pow(2,-10*x); }
function draw(){
 drawStudio();
 const d=parseFloat($('duration').value)||9;
 const p=t/d;
 let phaseIdx=0, tag='', main='', sub='', accent='#c8ff38';
 if(p<0.18){ phaseIdx=0; tag='TODAY • MATCHDAY'; main=`${val('home')} vs ${val('away')}`; sub=`${val('league')} • ${val('schedule')} ${val('kickoff')}`; accent='#c8ff38'; }
 else if(p<0.40){ phaseIdx=1; tag=val('marketNote')||'TOTAL GOALS'; main=val('market')||'OVER 2.5 GOALS'; sub=`${val('home')} vs ${val('away')}`; accent='#63e5ff'; }
 else if(p<0.60){ phaseIdx=2; tag='CORRECT SCORE'; main=val('score')||'2 - 1'; sub=`EXACT SCORE • ${val('home')}`; accent='#ff3d6c'; }
 else if(p<0.80){ phaseIdx=3; tag='WINNER PICK'; main=val('winner')||val('home'); sub='FULL-TIME WINNER'; accent='#c8ff38'; }
 else { phaseIdx=4; tag='FINAL PICKS'; main=`${val('market')} • ${val('score')}`; sub=`${val('winner')} • ${val('footer')}`; accent='#c8ff38'; }
 if(phaseIdx!==lastPhase && t>0.05){ if(phaseIdx===0){ sfxWhoosh(); sfxDeep(); } else if(phaseIdx===1){ sfxPop(); } else if(phaseIdx===2){ sfxPop(); setTimeout(sfxTick,90); } else if(phaseIdx===3){ sfxPop(); setTimeout(sfxTick,100); } else { sfxWhoosh(); sfxDeep(); }}
 lastPhase=phaseIdx;
 const labels=['INTRO','OVER / UNDER','SCORE','WINNER','FINAL']; $('stageLabel').textContent=labels[phaseIdx];
 const boundaries=[0,0.18,0.40,0.60,0.80,1.0];
 let b0=boundaries[phaseIdx], b1=boundaries[phaseIdx+1];
 let lp=(p-b0)/(b1-b0); lp=Math.max(0,Math.min(1,lp));
 ctx.save();
 ctx.globalAlpha=0.95;
 const wm = val('watermark') || 'FOOTBALL ANALYST • 2022';
 const topPad = 38;
 const wmW = Math.max(320, wm.length*14 + 90);
 roundRect(W/2 - wmW/2, topPad, wmW, 44, 22, 'rgba(0,0,0,0.70)', 'rgba(200,255,56,0.55)');
 ctx.font=`800 18px 'Space Grotesk'`; ctx.fillStyle='#e9f0ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillText(wm, W/2, topPad+22);
 ctx.restore();
 const zoneY = 680;
 const pop = easeOutBack(Math.min(1, lp/0.55));
 const fade = easeOutExpo(Math.min(1, lp/0.35));
 const slide = (1 - easeOutExpo(Math.min(1, lp/0.6)))*80;
 ctx.save();
 ctx.translate(W/2, zoneY);
 ctx.save();
 ctx.globalAlpha=fade; ctx.translate(0, -190 + slide*0.6); ctx.scale(pop,pop);
 const pillW=Math.max(240, Math.min(620, tag.length*19+90));
 roundRect(-pillW/2, -24, pillW, 48, 24, 'rgba(12,14,20,0.92)', accent);
 ctx.font=`800 22px 'Space Grotesk'`; ctx.fillStyle=accent; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(tag,0,0);
 ctx.restore();
 const mainDelay = Math.max(0, lp-0.15)/0.85;
 const mainPop = easeOutBack(Math.min(1, mainDelay/0.55));
 const mainFade = easeOutExpo(Math.min(1, mainDelay/0.4));
 const mainSlide = (1 - easeOutExpo(Math.min(1, mainDelay/0.7)))*60;
 ctx.save();
 ctx.globalAlpha=mainFade; ctx.translate(0, mainSlide); ctx.scale(mainPop,mainPop);
 ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=30; ctx.shadowOffsetY=10;
 roundRect(-480, -70, 960, 210, 22, 'rgba(8,11,18,0.88)', accent+'66');
 ctx.shadowColor='transparent';
 let mainSize=74; if(main.length>26) mainSize=52; else if(main.length>18) mainSize=62;
 ctx.font=`800 ${mainSize}px 'Space Grotesk'`; ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.lineWidth=9; ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.strokeText(main,0,24);
 ctx.fillStyle='#ffffff'; ctx.fillText(main,0,24);
 ctx.globalAlpha=mainFade*0.18; ctx.fillStyle=accent; ctx.fillText(main,0,24);
 ctx.globalAlpha=mainFade;
 ctx.restore();
 const subDelay = Math.max(0, lp-0.30)/0.70;
 const subFade = easeOutExpo(Math.min(1, subDelay/0.5));
 const subSlide = (1 - easeOutExpo(Math.min(1, subDelay/0.8)))*30;
 ctx.save();
 ctx.globalAlpha=subFade; ctx.translate(0, 140 + subSlide);
 ctx.font=`700 26px 'Space Grotesk'`; ctx.fillStyle='#d9e4f5'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(sub,0,0);
 ctx.beginPath(); ctx.arc(0, -32, 3, 0, Math.PI*2); ctx.fillStyle=accent; ctx.fill();
 ctx.restore();
 ctx.restore();
 ctx.save(); ctx.font=`600 18px 'Space Grotesk'`; ctx.fillStyle='rgba(203,213,230,0.85)'; ctx.textAlign='center'; ctx.fillText(val('footer')||'', W/2, H-90); ctx.restore();
 $('timeLabel').textContent=`00:${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')} / ${d.toFixed(1)}s`;
 $('scrubber').max=d; $('scrubber').value=t;
}
function play(){ if(t>=parseFloat($('duration').value)) t=0; playing=true; $('previewBtn').textContent='Ⅱ Pause'; getAudio(); last=performance.now(); function loop(now){ if(!playing) return; const delta=Math.min(0.05,(now-last)/1000); t += delta; last=now; draw(); if(t>=parseFloat($('duration').value)){ playing=false; $('previewBtn').textContent='▶ Preview'; return; } raf=requestAnimationFrame(loop); } raf=requestAnimationFrame(loop); }
function pause(){ playing=false; cancelAnimationFrame(raf); $('previewBtn').textContent='▶ Preview'; }
$('previewBtn').onclick=()=>playing?pause():play();
$('scrubber').oninput=e=>{ pause(); t=parseFloat(e.target.value); draw(); };
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ pause(); t=parseFloat(b.dataset.time); draw(); });
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{ if(!playing) draw(); }));
$('bgImage').onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 const url=URL.createObjectURL(f);
 const img=new Image(); img.onload=()=>{ bg=img; draw(); $('status').textContent='Studio background loaded.'; }; img.src=url;
};
$('exportBtn').onclick=async()=>{
  if(!('MediaRecorder' in window) || !canvas.captureStream){
    $('status').textContent='Export not supported in this browser. Please use Chrome or Edge on desktop.';
    return;
  }

  const duration = Math.max(2, parseFloat($('duration').value) || 9);
  pause();
  t = 0;
  lastPhase = -1;
  draw();

  const stream = canvas.captureStream(30);
  const audioDest = getAudio().createMediaStreamDestination();
  const combined = new MediaStream([
    ...stream.getVideoTracks(),
    ...audioDest.stream.getAudioTracks()
  ]);

  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

  let recorder;
  try {
    recorder = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 8_500_000 });
  } catch {
    recorder = new MediaRecorder(combined);
  }

  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onerror = () => {
    $('status').textContent = 'Export failed. Try reloading the page and using Chrome desktop.';
    $('exportBtn').disabled = false;
    $('exportBtn').textContent = '● Render & Download';
  };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `FA-reel-${Date.now()}.webm`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    $('status').textContent = 'Render complete. Download started.';
    $('exportBtn').disabled = false;
    $('exportBtn').textContent = '● Render & Download';
  };

  $('exportBtn').disabled = true;
  $('exportBtn').textContent = 'Rendering...';
  recorder.start();

  let exportStart = performance.now();
  let exportRaf = 0;
  function exportLoop(now){
    const delta = Math.min(0.05, (now - exportStart)/1000);
    exportStart = now;
    t += delta;
    if (t > duration) {
      t = duration;
      draw();
      recorder.stop();
      cancelAnimationFrame(exportRaf);
      return;
    }
    draw();
    exportRaf = requestAnimationFrame(exportLoop);
  }

  exportRaf = requestAnimationFrame(exportLoop);
};
window.addEventListener('load',()=>{ if(!bg){ const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>{ bg=img; draw(); }; img.src='/mnt/data/photo3773089022510510128.jpeg'; } draw(); });
draw();
</script>
</body>
</html>
